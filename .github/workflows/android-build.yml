name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Copy web assets to Android
      run: |
        mkdir -p android/MusicApp/app/src/main/assets/web
        cp -r web/* android/MusicApp/app/src/main/assets/web/
    
    - name: Grant execute permission for gradlew
      run: chmod +x android/MusicApp/gradlew
    
    - name: Build Debug APK
      run: |
        cd android/MusicApp
        ./gradlew assembleDebug --stacktrace --no-daemon
      env:
        GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m'
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/MusicApp/app/build/outputs/apk/debug/app-debug.apk
    
    - name: Build Release APK
      run: |
        cd android/MusicApp
        ./gradlew assembleRelease --stacktrace --no-daemon
      continue-on-error: true
      env:
        GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m'
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-release
        path: android/MusicApp/app/build/outputs/apk/release/app-release-unsigned.apk